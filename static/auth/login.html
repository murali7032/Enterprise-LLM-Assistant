<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Enterprise LLM Assistant</title>
    <link rel="icon" href="/auth/favicon.png?v=5" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/auth/favicon.png?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand">
          <img class="brand-mark" src="/auth/favicon.png?v=5" alt="LLM Assistant" width="42" height="42" />
          <div>
            <h1>LLM Assistant</h1>
            <p>Sign in to continue</p>
          </div>
        </div>

        <div class="error" id="error"></div>

        <form id="login-form">
          <label class="field">
            <span>Email</span>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary" type="submit" id="submit-btn">Sign in</button>
        </form>

        <div class="divider">or</div>
        <a class="btn btn-google" id="google-btn" href="/api/v1/auth/oauth/google/start">Continue with Google</a>

        <p class="muted">No account? <a href="/auth/register.html">Create one</a></p>
        <p class="muted"><a href="/auth/forgot-password.html">Forgot password?</a></p>
      </div>
    </div>

    <script src="/auth/auth.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("submit-btn");
      const googleBtn = document.getElementById("google-btn");

      loadOAuthProviders(googleBtn);

      fetch("/api/v1/auth/me", { credentials: "include", cache: "no-store" })
        .then((r) => {
          if (r.ok) window.location.replace("/chat/");
        })
        .catch(() => {});

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError(errorEl);
        submitBtn.disabled = true;
        try {
          const response = await authFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.message || data.detail || "Sign in failed");
          }
          window.location.replace("/chat/");
        } catch (error) {
          showError(errorEl, error.message);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
