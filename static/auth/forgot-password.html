<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Enterprise LLM Assistant</title>
    <link rel="icon" href="/auth/favicon.png?v=5" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/auth/favicon.png?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand">
          <img class="brand-mark" src="/auth/favicon.png?v=5" alt="LLM Assistant" width="42" height="42" />
          <div>
            <h1>LLM Assistant</h1>
            <p>Reset your password</p>
          </div>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="forgot-form">
          <label class="field">
            <span>Email</span>
            <input type="email" id="email" required />
          </label>
          <button class="btn btn-primary" type="submit" id="forgot-btn">Send reset link</button>
        </form>

        <form id="reset-form" style="display: none; margin-top: 1rem">
          <label class="field">
            <span>Reset token</span>
            <input type="text" id="token" required />
          </label>
          <label class="field">
            <span>New password</span>
            <input type="password" id="password" minlength="8" required />
          </label>
          <button class="btn btn-primary" type="submit" id="reset-btn">Update password</button>
        </form>

        <p class="muted"><a href="/auth/login.html">Back to sign in</a></p>
      </div>
    </div>

    <script src="/auth/auth.js"></script>
    <script>
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const forgotForm = document.getElementById("forgot-form");
      const resetForm = document.getElementById("reset-form");

      forgotForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError(errorEl);
        try {
          const response = await authFetch("/api/v1/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.message || data.detail || "Request failed");
          successEl.textContent = data.message || "If that email exists, a reset link was issued.";
          successEl.classList.add("visible");
          resetForm.style.display = "block";
          if (data.reset_token) {
            document.getElementById("token").value = data.reset_token;
          }
        } catch (error) {
          showError(errorEl, error.message);
        }
      });

      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError(errorEl);
        try {
          const response = await authFetch("/api/v1/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({
              token: document.getElementById("token").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.message || data.detail || "Reset failed");
          successEl.textContent = "Password updated. You can sign in now.";
          successEl.classList.add("visible");
          setTimeout(() => window.location.replace("/auth/login.html"), 800);
        } catch (error) {
          showError(errorEl, error.message);
        }
      });
    </script>
  </body>
</html>
