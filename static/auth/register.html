<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Enterprise LLM Assistant</title>
    <link rel="icon" href="/auth/favicon.png?v=5" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/auth/favicon.png?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand">
          <img class="brand-mark" src="/auth/favicon.png?v=5" alt="LLM Assistant" width="42" height="42" />
          <div>
            <h1>LLM Assistant</h1>
            <p>Create your account</p>
          </div>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="register-form">
          <label class="field">
            <span>Email</span>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password (min 8 characters)</span>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label class="field">
            <span>Retype password</span>
            <input
              type="password"
              id="password-confirm"
              name="password_confirm"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <button class="btn btn-primary" type="submit" id="submit-btn">Create account</button>
        </form>

        <div class="divider">or</div>
        <a class="btn btn-google" id="google-btn" href="/api/v1/auth/oauth/google/start">Continue with Google</a>

        <p class="muted">Already registered? <a href="/auth/login.html">Sign in</a></p>
      </div>
    </div>

    <script src="/auth/auth.js"></script>
    <script>
      const form = document.getElementById("register-form");
      const errorEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const submitBtn = document.getElementById("submit-btn");
      const googleBtn = document.getElementById("google-btn");

      loadOAuthProviders(googleBtn);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError(errorEl);
        successEl.classList.remove("visible");
        const password = document.getElementById("password").value;
        const passwordConfirm = document.getElementById("password-confirm").value;
        if (password !== passwordConfirm) {
          showError(errorEl, "Passwords do not match");
          return;
        }
        submitBtn.disabled = true;
        try {
          const email = document.getElementById("email").value.trim();
          const response = await authFetch("/api/v1/auth/register", {
            method: "POST",
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.message || data.detail || "Registration failed");
          }
          successEl.textContent = "Account created. Signing you in…";
          successEl.classList.add("visible");

          const loginResponse = await authFetch("/api/v1/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
          });
          if (!loginResponse.ok) {
            window.location.replace("/auth/login.html");
            return;
          }
          window.location.replace("/chat/");
        } catch (error) {
          showError(errorEl, error.message);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
